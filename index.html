<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><title>ServiceNow Academy</title><link rel="manifest" href="manifest.json"><style>:root{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color-scheme:dark;--bg:#0d1322;--card:#1b2538;--text:#f7fafc;--muted:#a9b7cf;--accent:#75e1b0;--border:#33415a}body.light{color-scheme:light;--bg:#f4f7fc;--card:#fff;--text:#182337;--muted:#66758c;--accent:#157c65;--border:#dfe5ef}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text)}main{max-width:520px;margin:auto;padding:25px 18px 105px}header{display:flex;align-items:center;justify-content:space-between}h1{font-size:27px;margin:10px 0}h2{font-size:21px}p{color:var(--muted);line-height:1.5}.card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:18px;margin:15px 0}.hero{background:linear-gradient(120deg,#1e625e,#333a87);color:white}.hero p{color:#e1f5f0}.pill{display:inline-block;background:#ffffff25;border-radius:50px;padding:8px 12px;margin:3px;font-size:13px}button{cursor:pointer;font:inherit;border:0;border-radius:13px;padding:13px 16px;font-weight:700;background:var(--accent);color:#081c19}button.secondary{background:var(--card);color:var(--text);border:1px solid var(--border)}button.option{display:block;width:100%;text-align:left;margin:9px 0;background:var(--card);border:1px solid var(--border);color:var(--text)}button.option.selected{border-color:var(--accent)}button:disabled{opacity:.4}.progress{height:11px;background:#ffffff30;border-radius:12px;overflow:hidden}.progress span{display:block;background:#78e8bb;height:100%}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.small{font-size:13px}.unit{border-left:4px solid var(--accent)}nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--border);display:flex;justify-content:center;padding:10px 4px max(12px,env(safe-area-inset-bottom))}nav button{flex:1;max-width:105px;background:transparent;color:var(--muted);font-size:12px;padding:7px 2px}nav button.active{color:var(--accent)}input,select{width:100%;border:1px solid var(--border);background:var(--bg);color:var(--text);padding:12px;border-radius:10px;margin:7px 0 13px}label{font-size:14px} .hidden{display:none}.badge{font-size:30px}.feedback{font-weight:700;margin:12px 0}</style><style>.v4-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.v4-grid button{min-height:76px}.v4-tag{font-size:12px;color:var(--muted)}.v4-good{border:2px solid #29b980!important}.v4-bad{border:2px solid #f18c80!important}.v4-meter{height:9px;border-radius:10px;background:var(--border);overflow:hidden}.v4-meter>span{display:block;background:var(--accent);height:100%}.v4-field{display:block;margin:12px 0}.v4-field textarea{width:100%;min-height:85px;border-radius:10px;padding:12px;background:var(--bg);color:var(--text);border:1px solid var(--border)}.v4-table{width:100%;border-collapse:collapse;font-size:13px}.v4-table td,.v4-table th{padding:10px 4px;border-bottom:1px solid var(--border);text-align:left}</style></head><body><main><header><div><div class="small">YOUR LEARNING SPACE</div><h1>⚡ ServiceNow Academy</h1></div><button class="secondary" id="theme" aria-label="Toggle theme">☀️</button></header><section id="screen"></section></main><nav id="nav"></nav><script>
const units=[{title:'ServiceNow Fundamentals',icon:'🌱',lessons:[['What is ServiceNow?','ServiceNow is a cloud platform that helps organisations manage work, services, and requests.','What can ServiceNow help a company manage?',['IT support tickets','Only video games','Only music'],0],['Cloud platform basics','A cloud platform runs on servers accessed through the internet. You can use ServiceNow through a browser.','Where does a cloud platform run?',['Only on your phone','On internet-connected servers','On paper'],1],['Applications and modules','An application groups related work. A module opens a specific part of that work, such as Incidents.','Which item can open an Incident list?',['A module','A password','A wallpaper'],0]]},{title:'Tables, Forms & Lists',icon:'🗂️',lessons:[['Tables and records','A table stores a type of information. Each record is one entry, and each field holds a value.','What is one entry in a table called?',['A record','A server','A dashboard'],0],['Lists vs forms','A list shows multiple records. A form shows the details of one record.','What shows details of a single incident?',['List','Form','Theme'],1]]},{title:'Users, Groups & Security',icon:'🔐',lessons:[['Users and groups','A user is a person with access. A group collects users who work on similar tasks.','What is a support team represented by?',['A group','A field type','A chart'],0],['Roles and ACLs','Roles describe permissions. Access Control Lists (ACLs) help determine who can access records and fields.','What controls record access?',['ACL','Colour theme','Streak'],0]]},{title:'IT Service Management',icon:'🛠️',lessons:[['Incident Management','An incident is an unplanned interruption to a service. Teams record, assign, investigate, and resolve incidents.','An employee cannot access email. What should you create?',['Incident','Holiday request','Report'],0],['Problem Management','Problem Management investigates underlying causes of incidents, especially repeated incidents.','What focuses on the underlying cause?',['Problem','Theme','Profile'],0],['Change Management','Change Management helps assess and manage risks when changing services or systems.','What process manages planned service changes?',['Change','Incident only','Quiz'],0]]},{title:'Service Catalog, SLA & CMDB',icon:'⏱️',lessons:[['Service Catalog','A service catalog lets people request standard goods and services.','Where could someone request a new laptop?',['Service Catalog','CMDB only','Theme settings'],0],['SLAs','A Service Level Agreement sets agreed service targets such as response or resolution time.','What does an SLA describe?',['Service targets','Screen brightness','Passwords'],0],['CMDB','A Configuration Management Database tracks configuration items and their relationships.','What is a CI?',['Configuration Item','Course Icon','Customer Invoice'],0]]},{title:'Scripting & Business Logic',icon:'💡',lessons:[['Client Scripts','Client scripts run in the browser and can react when a form loads, changes, or is submitted.','Where does a client script run?',['Browser','Printer','Paper'],0],['Business Rules','Business rules run on the server and can enforce logic when records are processed.','Where does a business rule run?',['Server','Keyboard','Wallpaper'],0]]},{title:'Flow Designer',icon:'🔄',lessons:[['Automation basics','Flow Designer automates processes using triggers, actions, and conditions.','What starts a flow?',['Trigger','Badge','Theme'],0]]},{title:'Reporting & Data',icon:'📊',lessons:[['Reports','Reports help turn record data into useful charts, lists, and summaries.','What helps visualise incident trends?',['Report','Password','ACL'],0],['Import Sets','Import sets stage external data before transforming it into target tables.','What is used to stage imported data?',['Import Set','Streak','Badge'],0]]},{title:'App Development & Integrations',icon:'🧱',lessons:[['Scoped applications','Scoped applications group related configuration and help separate custom app resources.','Why use an application scope?',['Organise and isolate app resources','Change screen colour','Earn XP'],0],['Integrations','Integrations exchange data between ServiceNow and other systems, often using APIs.','What is commonly used to connect systems?',['API','Theme','Badge'],0]]},{title:'Workplace Projects & CSA Prep',icon:'🏆',lessons:[['Incident scenario','An employee reports that their email is unavailable. You should capture the issue, assess impact and urgency, and assign the incident.','Which is a sensible first action?',['Create and document an incident','Delete all records','Ignore the issue'],0],['Carbon project scenario','A carbon project app can track landowners, parcels, project status, and approvals in related tables.','What connects a parcel to its landowner?',['Reference field','Theme toggle','XP'],0]]}];
const extraUnits=[{"title": "Navigation & Records", "icon": "🧭", "lessons": [["Application Navigator", "Use the All menu or application navigator to find applications and modules.", "Where do you open the Incidents module?", ["Application navigation", "Theme settings", "Email inbox"], 0], ["Filtering lists", "Use conditions to filter records, such as State is New.", "How do you find only new incidents?", ["Delete records", "Apply a list filter", "Change theme"], 1], ["Reference fields", "A reference field links a record to another table, such as Caller referencing a User.", "What field links an incident to a caller?", ["Reference", "Checkbox", "Date"], 0]]}, {"title": "Access & Form Behaviour", "icon": "🛡️", "lessons": [["UI Policies", "UI Policies can make form fields mandatory, read-only or hidden based on conditions.", "What makes a field mandatory on a form?", ["UI Policy", "Report", "CMDB"], 0], ["ACL evaluation", "ACLs determine whether users can read, write, create or delete records or fields.", "Who should be able to edit restricted payroll data?", ["Everyone", "Only authorised users", "Anonymous visitors"], 1], ["Client vs server", "Client Scripts run in the browser; Business Rules execute on the server.", "What is best for enforcing a server-side update?", ["Business Rule", "Theme", "List layout"], 0]]}, {"title": "ITSM Workplace Scenarios", "icon": "🎫", "lessons": [["Incident priority", "Incident priority is typically calculated from impact and urgency according to a configured matrix.", "What two factors commonly determine priority?", ["Colour and font", "Impact and urgency", "Caller and email"], 1], ["Request fulfilment", "A catalog request may create Requested Items (RITMs) and fulfilment tasks.", "What is a RITM?", ["Requested Item", "Report Item", "Risk Metric"], 0], ["Problem vs incident", "Incidents restore service; problems investigate root causes of one or more incidents.", "Five similar incidents keep returning. What else should you investigate?", ["Problem record", "Theme", "Profile"], 0], ["Change approval", "Normal changes often follow assessment and approval before implementation.", "Why assess changes?", ["To manage risk", "To gain XP", "To delete tickets"], 0]]}, {"title": "Automation & Data Practice", "icon": "⚙️", "lessons": [["Flow trigger", "A flow can start when a record is created or updated.", "What starts a Flow Designer flow?", ["Trigger", "Badge", "Dashboard"], 0], ["Transform Maps", "A Transform Map maps fields from an import set to a target table.", "What maps incoming fields to target fields?", ["Transform Map", "Incident", "Catalog"], 0], ["Notifications", "Notifications can send messages when specified events or record conditions occur.", "What sends a configured email alert?", ["Notification", "UI theme", "Reference"], 0], ["Dashboards", "Dashboards collect reports and indicators for quick monitoring.", "Where can you view several reports together?", ["Dashboard", "ACL", "Import Set"], 0]]}, {"title": "Carbon Project Build", "icon": "🌳", "lessons": [["Landowner table", "Create a Landowners table to store name, contact details and landowner identifiers.", "Where should a landowner phone number live?", ["Landowners record", "Incident priority", "Theme"], 0], ["Land parcel reference", "A Land Parcels table can reference a Landowners record.", "What connects a parcel to its owner?", ["Reference field", "Button colour", "Streak"], 0], ["Approval tracking", "Use fields or related approval records to track reviews, decisions and dates.", "Which field helps track approval status?", ["Status choice", "Wallpaper", "XP"], 0], ["KML attachments", "KML files can be stored as record attachments in a properly configured instance.", "What is a sensible place for a parcel KML?", ["Parcel record attachment", "Profile photo", "Quiz answer"], 0]]}];units.push(...extraUnits);
const total=units.reduce((n,u)=>n+u.lessons.length,0);let state=JSON.parse(localStorage.getItem('sna-v1')||'{"done":[],"xp":0,"theme":"dark","streak":0,"last":""}');let page='Home',current=null,selected=null;function save(){localStorage.setItem('sna-v1',JSON.stringify(state))}function theme(){document.body.classList.toggle('light',state.theme==='light');document.getElementById('theme').textContent=state.theme==='light'?'🌙':'☀️'}function setTheme(){state.theme=state.theme==='light'?'dark':'light';save();theme()}document.getElementById('theme').onclick=setTheme;theme();const el=document.getElementById('screen');function nav(){document.getElementById('nav').innerHTML=['Home','Learn','Practice','Projects','Profile'].map((p,i)=>`<button class="${page===p?'active':''}" onclick="go('${p}')">${['🏠','📚','🎮','🏢','👤'][i]}<br>${p}</button>`).join('')}function go(p){page=p;current=null;render();window.scrollTo(0,0)}function lessonKey(u,l){return u+'-'+l}function start(u,l){current=[u,l];selected=null;render();window.scrollTo(0,0)}function finish(){let [u,l]=current,key=lessonKey(u,l);if(!state.done.includes(key)){state.done.push(key);state.xp+=10;let today=new Date().toLocaleDateString('en-CA');if(state.last!==today){let yesterday=new Date();yesterday.setDate(yesterday.getDate()-1);state.streak=state.last===yesterday.toLocaleDateString('en-CA')?state.streak+1:1;state.last=today}save()}el.innerHTML=`<div class="card"><h2>🎉 Correct!</h2><p>+10 XP earned. Great work!</p><button onclick="nextLesson(${u},${l})">Continue →</button></div>`}function nextLesson(u,l){if(l+1<units[u].lessons.length)start(u,l+1);else if(u+1<units.length)start(u+1,0);else go('Home')}function check(){let [u,l]=current,a=units[u].lessons[l][4];document.getElementById('feedback').textContent=selected===a?'✅ That’s right!':'❌ Try again. Read the explanation and choose another answer.';if(selected===a)finish()}function choose(i){selected=i;document.querySelectorAll('.option').forEach((b,j)=>b.classList.toggle('selected',i===j));document.getElementById('check').disabled=false}function render(){nav();if(current){let [u,l]=current,d=units[u].lessons[l];el.innerHTML=`<p><button class="secondary" onclick="go('Learn')">← Back</button></p><p class="small">LEVEL ${u+1} · LESSON ${l+1}</p><div class="card"><h2>${d[0]}</h2><p>${d[1]}</p></div><div class="card"><h2>🧠 Quick check</h2><p>${d[2]}</p>${d[3].map((a,i)=>`<button class="option" onclick="choose(${i})">${String.fromCharCode(65+i)}. ${a}</button>`).join('')}<div id="feedback" class="feedback"></div><button id="check" disabled onclick="check()">Check answer</button></div>`;return}let pct=Math.round(state.done.filter(k=>/^\d+-\d+$/.test(k)).length/total*100);if(page==='Home')el.innerHTML=`<div class="card hero"><span class="pill">🔥 ${state.streak} day streak</span><span class="pill">⭐ ${state.xp} XP</span><h2>Ready to level up?</h2><p>Learn ServiceNow one small step at a time.</p><div class="progress"><span style="width:${pct}%"></span></div><p>${state.done.filter(k=>/^\d+-\d+$/.test(k)).length} of ${total} lessons complete · ${pct}%</p><button onclick="go('Learn')">Continue learning →</button></div><h2>Your learning journey</h2>${units.slice(0,4).map((u,i)=>`<div class="card row"><span class="badge">${u.icon}</span><div style="flex:1"><strong>Level ${i+1}: ${u.title}</strong><p class="small">${u.lessons.filter((_,j)=>state.done.includes(lessonKey(i,j))).length}/${u.lessons.length} completed</p></div><button onclick="start(${i},0)">Go</button></div>`).join('')}`;if(page==='Learn')el.innerHTML=`<h2>📚 Complete learning path</h2><p>${total} interactive starter lessons across 10 levels. More depth and simulator activities can be added over time.</p>${units.map((u,i)=>`<div class="card unit"><h2>${u.icon} Level ${i+1}: ${u.title}</h2>${u.lessons.map((d,j)=>`<div class="row" style="padding:9px 0;border-top:1px solid var(--border)"><span>${state.done.includes(lessonKey(i,j))?'✅':'⭕'} ${d[0]}</span><button class="secondary" onclick="start(${i},${j})">Open</button></div>`).join('')}</div>`).join('')}`;if(page==='Practice')el.innerHTML=`<h2>🎮 Practice lab</h2><p>Try a beginner-friendly incident simulation. This is a learning form, not a live ServiceNow instance.</p><div class="card"><h2>📩 Email not working</h2><p>An employee cannot access company email. Create an incident with appropriate details.</p><label>Short description<input id="desc" placeholder="e.g. Employee cannot access email"></label><label>Impact<select id="impact"><option value="">Choose impact</option><option value="1">1 - High</option><option value="2">2 - Medium</option><option value="3">3 - Low</option></select></label><label>Urgency<select id="urgency"><option value="">Choose urgency</option><option value="1">1 - High</option><option value="2">2 - Medium</option><option value="3">3 - Low</option></select></label><label>Assignment group<select id="group"><option value="">Choose group</option><option>Service Desk</option><option>Network Support</option><option>Facilities</option></select></label><button onclick="submitIncident()">Submit practice incident</button><p id="incidentResult"></p></div>`;if(page==='Projects')el.innerHTML=`<h2>🏢 Workplace projects</h2><div class="card"><h2>🌳 REDD+ Carbon Project Management</h2><p>Project brief: Design a scoped application with Landowners, Land Parcels, and Projects tables. Connect records with reference fields and plan approval tracking.</p><p><strong>Task 1:</strong> Identify the three tables and explain how they relate.</p><button onclick="start(9,1)">Start project quiz</button></div><div class="card"><h2>🛠️ IT Support Desk</h2><p>Practise logging an incident, setting impact and urgency, and assigning a support group.</p><button onclick="go('Practice')">Open simulator</button></div>`;if(page==='Profile')el.innerHTML=`<h2>👤 My profile</h2><div class="card"><h2>🏆 Learning achievements</h2><p>⭐ ${state.xp} XP · 🔥 ${state.streak} day streak</p><p>📚 ${state.done.filter(k=>/^\d+-\d+$/.test(k)).length}/${total} lessons complete</p><p>${state.done.length>=5?'🥉 Five-lesson badge unlocked!':'Complete 5 lessons to unlock your first badge.'}</p></div><div class="card"><h2>⚙️ Appearance</h2><p>Current mode: ${state.theme}</p><button onclick="setTheme();render()">Switch light / dark mode</button></div><p class="small">Progress is saved locally in this browser on this device. Clearing browser storage can erase it.</p>`}function submitIncident(){let d=document.getElementById('desc').value.trim(),i=document.getElementById('impact').value,u=document.getElementById('urgency').value,g=document.getElementById('group').value;document.getElementById('incidentResult').textContent=(!d||!i||!u||!g)?'⚠️ Complete all fields before submitting.':(d.length<12?'⚠️ Make your description more specific.':'✅ Practice incident recorded successfully! You completed the scenario. (Training only.)')}render();
const labTasks=[
{title:"Create an incident",kind:"incident",help:"Complete the incident form in the Practice tab."},
{title:"Choose the correct record type",kind:"choice",prompt:"An employee requests a new laptop. Which record starts the process?",options:["Incident","Catalog request","Problem"],answer:1,why:"A standard laptop order belongs in the Service Catalog."},
{title:"Configure field access",kind:"choice",prompt:"Only the HR team should read salary records. What do you configure?",options:["ACL","Dashboard","SLA"],answer:0,why:"ACLs enforce access permissions."},
{title:"Build a parcel relationship",kind:"choice",prompt:"Your Land Parcel record must point to its Landowner. Which field type?",options:["Integer","Reference","True/False"],answer:1,why:"A reference field links records across tables."},
{title:"Automate an assignment",kind:"choice",prompt:"When a new request arrives, you want a task created automatically. Which tool is suitable?",options:["Flow Designer","Theme switch","List filter"],answer:0,why:"Flow Designer automates triggered processes."}
];
let labIndex=1;
function labView(){
 const task=labTasks[labIndex];
 el.innerHTML=`<p><button class="secondary" onclick="go('Practice')">← Practice</button></p><p class="small">LAB ${labIndex+1} OF ${labTasks.length}</p><div class="card"><h2>🧪 ${task.title}</h2><p>${task.prompt}</p>${task.options.map((o,i)=>`<button class="option" onclick="labAnswer(${i})">${String.fromCharCode(65+i)}. ${o}</button>`).join('')}<p id="labFeedback" role="status"></p></div><div class="card"><p class="small">Training simulator • Not connected to ServiceNow</p></div>`;
}
function labAnswer(i){
 const t=labTasks[labIndex];
 const f=document.getElementById('labFeedback');
 if(i!==t.answer){f.textContent="❌ Not quite. Try again.";return}
 const key="lab-"+labIndex;
 if(!state.done.includes(key)){state.done.push(key);state.xp+=15;save()}
 f.innerHTML=`✅ Correct! ${t.why} <strong>+15 XP</strong><br><br><button onclick="nextLab()">Next lab →</button>`;
 document.querySelectorAll('.option').forEach(b=>b.disabled=true);
}
function nextLab(){labIndex=labIndex+1<labTasks.length?labIndex+1:1;labView()}
const baseGo=go;
go=function(p){baseGo(p);if(p==='Practice'){el.insertAdjacentHTML('afterbegin',`<div class="card"><h2>🧪 Guided mini-labs</h2><p>Practise access rules, requests, references and automation. Correct answers earn 15 XP.</p><button onclick="labView()">Start guided labs →</button></div>`)}};

const simKey='sna-sim-v3';
let simRecords=[];
try{simRecords=JSON.parse(localStorage.getItem(simKey)||'[]')}catch(e){simRecords=[]}
function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function simHome(){
 page='Practice';nav();
 el.innerHTML=`<p><button class="secondary" onclick="go('Practice')">← Practice</button></p>
 <div class="card hero"><span class="pill">🖥️ Admin workspace</span><h2>ServiceNow-style simulator</h2><p>Complete realistic forms, then review your saved practice records. This simulator is not connected to ServiceNow.</p></div>
 <div class="card"><h2>🎯 Your mission</h2><p>Choose a workplace task. Each successful first-time task earns 25 XP.</p>
 <button class="option" onclick="simForm('incident')">🎫 Create an incident →</button>
 <button class="option" onclick="simForm('user')">👤 Add a support user →</button>
 <button class="option" onclick="simForm('parcel')">🌳 Register a land parcel →</button>
 <button class="option" onclick="simList()">📋 View my practice records (${simRecords.length}) →</button></div>`;

incident:{title:'New incident',prefix:'INC',intro:'Scenario: An employee cannot access company email. Record the incident and route it to the Service Desk.',fields:[

user:{title:'New user',prefix:'USR',intro:'Scenario: A new IT support colleague needs a training user record.',fields:[

function simForm(kind){
 const t=simFields[kind];page='Practice';nav();
 el.innerHTML=`<p><button class="secondary" onclick="simHome()">← Workspace</button></p>
 <p class="small">TRAINING INSTANCE / ${kind.toUpperCase()} / NEW</p>
 <div class="card"><h2>🖥️ ${t.title}</h2><p>${t.intro}</p>
 <form id="simform" onsubmit="simSubmit(event,'${kind}')">
 ${t.fields.map(([key,label,type,opts])=>`<label>${label} <span class="small">*</span>
 ${type==='select'?`<select name="${key}" required>${opts.map((o,i)=>`<option value="${esc(o)}">${i===0?'Select...':esc(o)}</option>`).join('')}</select>`:type==='textarea'?`<textarea name="${key}" required placeholder="${esc(opts)}" style="width:100%;min-height:85px;border-radius:12px;padding:12px;background:var(--bg);color:var(--text);border:1px solid var(--border)"></textarea>`:`<input name="${key}" type="${type}" required placeholder="${esc(opts)}">`}
 </label>`).join('')}
 <p id="simFeedback" role="status"></p><button type="submit">Submit record →</button></form></div>`;
}
function simSubmit(e,kind){
 e.preventDefault();
 const values=Object.fromEntries(new FormData(e.target).entries());
 if(Object.values(values).some(v=>!String(v).trim())){document.getElementById('simFeedback').textContent='⚠️ Please complete every field.';return}
 if(kind==='incident'&&values.short_description.trim().length<12){document.getElementById('simFeedback').textContent='⚠️ Short description must be at least 12 characters.';return}
 const id=simFields[kind].prefix+String(simRecords.length+1).padStart(5,'0');
 const record={id,kind,values,created:new Date().toISOString()};
 simRecords.push(record);localStorage.setItem(simKey,JSON.stringify(simRecords));
 const xpKey='sim-'+kind;
 let gained=0;
 if(!state.done.includes(xpKey)){state.done.push(xpKey);state.xp+=25;gained=25;save()}
 const priority=kind==='incident'?`<p><strong>Priority:</strong> P${Math.min(5,Math.ceil((Number(values.impact[0])+Number(values.urgency[0]))/2)+((Number(values.impact[0])===3&&Number(values.urgency[0])===3)?1:0))} (simplified training estimate; real instances use configured priority matrices)</p>`:'';
 el.innerHTML=`<p><button class="secondary" onclick="simHome()">← Workspace</button></p><div class="card"><h2>✅ Record submitted</h2><p><strong>${id}</strong> saved locally in this browser.</p>${priority}<p>${gained?'+25 XP earned!':'Practice completed again (XP already awarded for this task).'}</p><button onclick="simList()">View records →</button><button class="secondary" onclick="simForm('${kind}')">Create another →</button></div>`;
}
function simList(){
 page='Practice';nav();
 el.innerHTML=`<p><button class="secondary" onclick="simHome()">← Workspace</button></p><h2>📋 Practice records</h2>
 <p class="small">Stored locally on this device, not in ServiceNow.</p>
 ${simRecords.length?simRecords.slice().reverse().map(r=>`<div class="card"><strong>${esc(r.id)}</strong> · ${esc(r.kind)}<p>${esc(r.values.short_description||r.values.name||r.values.parcel_name)}</p><p class="small">${esc(new Date(r.created).toLocaleString())}</p></div>`).join(''):'<div class="card">No records yet. Create your first one!</div>'}`;
}
const oldGoV3=go;
go=function(p){oldGoV3(p);if(p==='Practice'){el.insertAdjacentHTML('afterbegin',`<div class="card"><h2>🖥️ Realistic form simulator</h2><p>Create incidents, support users and REDD+ parcels. Review saved practice records.</p><button onclick="simHome()">Open admin workspace →</button></div>`) }};


/* V4 extension: preserves all V3 progress keys and saved training records. */
const v4Key='sna-v4';
let v4;
try{v4=JSON.parse(localStorage.getItem(v4Key)||'{}')}catch(_){v4={}}
v4.badges=Array.isArray(v4.badges)?v4.badges:[];
v4.completed=Array.isArray(v4.completed)?v4.completed:[];
v4.attempts=Number(v4.attempts)||0;
function v4save(){localStorage.setItem(v4Key,JSON.stringify(v4))}
const v4Challenges=[
{title:'Triage an email outage',type:'Incident',question:'One employee cannot access email; other colleagues can. What is the best first action?',answers:['Delete their account','Log an incident and investigate','Create a company-wide emergency change'],correct:1,why:'An incident records the service interruption and supports investigation.'},
{title:'Laptop request',type:'Catalog',question:'A new starter needs a standard laptop. Where should they begin?',answers:['Service Catalog','Problem Management','CMDB'],correct:0,why:'Standard equipment requests normally start through a catalog item.'},
{title:'Protect sensitive data',type:'Security',question:'Only authorised payroll users should read salary fields. Which control enforces access?',answers:['ACL','UI theme','Dashboard'],correct:0,why:'ACLs enforce access to records and fields; UI policies are not security controls.'},
{title:'Repeated incidents',type:'Problem',question:'Five similar VPN incidents occur each week. What should you investigate?',answers:['Only change the colour of the form','Open a problem investigation','Ignore the pattern'],correct:1,why:'Problem Management investigates the underlying cause of recurring incidents.'},
{title:'Link landowners',type:'Carbon',question:'A parcel must point to one landowner record. Which field type?',answers:['Reference','True/false','Journal'],correct:0,why:'A reference field connects one table to another.'},
{title:'Automate approval',type:'Flow',question:'When a carbon project reaches Review, you need an approval task. Which tool can automate this?',answers:['Flow Designer','List filter','Theme settings'],correct:0,why:'Flow Designer uses triggers, conditions and actions to automate work.'},
{title:'Import a spreadsheet',type:'Data',question:'What maps import set fields into the target table?',answers:['Transform Map','SLA','Dashboard'],correct:0,why:'Transform Maps map and transform incoming fields into target records.'},
{title:'Plan a change',type:'Change',question:'Why assess risk before implementing a normal change?',answers:['To reduce service disruption','To increase XP','To remove all approvals'],correct:0,why:'Risk assessment supports safe implementation and appropriate approval.'}
];
const v4Modules=[
['Foundations','Navigation, tables, records, forms, lists, roles and groups.'],
['ITSM','Incident, request, problem, change, SLAs and CMDB.'],
['Administration','Users, groups, roles, ACLs, UI policies and data imports.'],
['Automation','Client scripts, business rules, notifications and Flow Designer.'],
['Platform development','Scoped applications, reference fields, integrations and reports.'],
['REDD+ project portfolio','Landowners, land parcels, approval workflows and project tracking.'],
['CSA revision','Mixed scenario questions and progress-based revision.']
];
function v4Hub(){
 page='Practice';nav();
 el.innerHTML=`<p><button class="secondary" onclick="go('Practice')">← Practice</button></p>
 <div class="card hero"><span class="pill">NEW • VERSION 4</span><h2>🎮 Learning Arcade</h2><p>Short challenges, workplace scenarios and a realistic training workspace.</p></div>
 <div class="v4-grid"><button onclick="v4Quiz(0)">🧠 Daily challenge</button><button onclick="v4Quiz(-1)">🎓 CSA revision</button><button onclick="simHome()">🖥️ Admin simulator</button><button onclick="v4Workflow()">🔄 Workflow builder</button></div>
 <div class="card"><h2>🏅 Achievements</h2><p>${v4.completed.length}/${v4Challenges.length} challenges completed · ${v4.badges.length} badges</p><div class="v4-meter"><span style="width:${Math.round(100*v4.completed.length/v4Challenges.length)}%"></span></div><p class="small">Practice achievements are saved on this device. These are not official ServiceNow certifications.</p></div>`;
}
let v4Q=0,v4Selected=null,v4Mixed=false;
function v4Quiz(n){
 v4Mixed=n<0;v4Q=v4Mixed?0:n;v4Selected=null;v4ShowQuestion();
}
function v4ShowQuestion(){
 page='Practice';nav();
 const q=v4Challenges[v4Q];
 el.innerHTML=`<p><button class="secondary" onclick="v4Hub()">← Arcade</button></p><p class="v4-tag">${v4Mixed?'CSA-STYLE REVISION':'WORKPLACE CHALLENGE'} · ${v4Q+1} / ${v4Challenges.length}</p>
 <div class="card"><h2>${q.title}</h2><p class="pill">${q.type}</p><p>${q.question}</p>
 ${q.answers.map((a,i)=>`<button class="option" id="v4opt${i}" onclick="v4Choose(${i})">${String.fromCharCode(65+i)}. ${a}</button>`).join('')}
 <div id="v4Feedback" role="status"></div><button id="v4Check" disabled onclick="v4Check()">Check answer →</button></div>`;
}
function v4Choose(i){v4Selected=i;document.querySelectorAll('[id^=v4opt]').forEach((b,j)=>b.classList.toggle('selected',j===i));document.getElementById('v4Check').disabled=false}
function v4Check(){
 const q=v4Challenges[v4Q],ok=v4Selected===q.correct;
 v4.attempts++;v4save();
 document.querySelectorAll('[id^=v4opt]').forEach((b,i)=>{b.disabled=true;if(i===q.correct)b.classList.add('v4-good');else if(i===v4Selected)b.classList.add('v4-bad')});
 document.getElementById('v4Check').disabled=true;
 let reward='';
 if(ok&&!v4.completed.includes(v4Q)){
  v4.completed.push(v4Q);state.xp+=15;save();reward=' +15 XP!';
  if(v4.completed.length>=4&&!v4.badges.includes('Scenario Starter'))v4.badges.push('Scenario Starter');
  if(v4.completed.length===v4Challenges.length&&!v4.badges.includes('Scenario Explorer'))v4.badges.push('Scenario Explorer');
  v4save();
 }
 document.getElementById('v4Feedback').innerHTML=`<p class="feedback">${ok?'✅ Correct!'+reward:'❌ Not quite. The correct answer is '+q.answers[q.correct]+'.'}</p><p>${q.why}</p><button onclick="v4Next()">Next challenge →</button>`;
}
function v4Next(){if(v4Q+1<v4Challenges.length){v4Q++;v4Selected=null;v4ShowQuestion()}else v4Results()}
function v4Results(){
 el.innerHTML=`<div class="card"><h2>🏆 Challenge set complete</h2><p>${v4.completed.length}/${v4Challenges.length} unique challenges answered correctly so far.</p><p>Badges: ${v4.badges.join(', ')||'Keep practising to unlock one!'}</p><button onclick="v4Hub()">Back to Arcade</button><button class="secondary" onclick="v4Quiz(0)">Retry questions</button></div>`;
}
const v4Steps=['Trigger: project status changes to Under Review','Condition: project has an assigned reviewer','Action: create an approval task','Action: notify project owner'];
let v4Flow=[];
function v4Workflow(){
 page='Practice';nav();v4Flow=[];v4DrawFlow();
}
function v4DrawFlow(){
 el.innerHTML=`<p><button class="secondary" onclick="v4Hub()">← Arcade</button></p><div class="card"><h2>🔄 Approval workflow builder</h2><p>Build a simple REDD+ review workflow by selecting steps in the correct order.</p>
 <p class="v4-tag">STEPS ${v4Flow.length}/4</p><div class="v4-meter"><span style="width:${v4Flow.length*25}%"></span></div>
 ${v4Flow.map((i,j)=>`<p>✅ ${j+1}. ${v4Steps[i]}</p>`).join('')}
 ${v4Steps.map((t,i)=>v4Flow.includes(i)?'':`<button class="option" onclick="v4FlowStep(${i})">${t}</button>`).join('')}
 <p id="v4FlowFeedback" role="status"></p></div>`;
}
function v4FlowStep(i){
 if(i!==v4Flow.length){document.getElementById('v4FlowFeedback').textContent='⚠️ Not yet. Start with the trigger, then condition, then actions.';return}
 v4Flow.push(i);v4DrawFlow();
 if(v4Flow.length===4){
 let reward='';
 if(!v4.completed.includes('workflow')){v4.completed.push('workflow');state.xp+=30;save();v4save();reward=' +30 XP'}
 document.getElementById('v4FlowFeedback').innerHTML=`✅ Workflow completed!${reward} This is a training exercise, not a deployed flow. <button onclick="v4Hub()">Finish →</button>`;
 }
}
function v4Course(){
 page='Learn';nav();
 el.innerHTML=`<p><button class="secondary" onclick="go('Learn')">← Lessons</button></p><h2>🗺️ Your ServiceNow roadmap</h2><p>Follow this learning path from beginner topics to workplace simulations and CSA-style revision.</p>
 ${v4Modules.map((m,i)=>`<div class="card"><h2>${i+1}. ${m[0]}</h2><p>${m[1]}</p><button onclick="${i===5?"go('Projects')":i===6?'v4Quiz(-1)':"go('Learn')"}">${i===6?'Start revision':'Explore lessons'} →</button></div>`).join('')}
 <p class="small">This roadmap organises the existing starter lessons and practice. It does not yet constitute a complete official ServiceNow course.</p>`;
}
const v4PrevGo=go;
go=function(p){v4PrevGo(p);if(p==='Practice')el.insertAdjacentHTML('afterbegin',`<div class="card hero"><h2>🎮 Version 4 Learning Arcade</h2><p>Daily challenges, CSA-style revision, badges and workflow practice.</p><button onclick="v4Hub()">Open Learning Arcade →</button></div>`);
if(p==='Learn')el.insertAdjacentHTML('afterbegin',`<div class="card"><h2>🗺️ Guided learning roadmap</h2><p>See the course modules and choose your next skill.</p><button onclick="v4Course()">View roadmap →</button></div>`);
if(p==='Profile')el.insertAdjacentHTML('afterbegin',`<div class="card"><h2>🏅 Version 4 achievements</h2><p>${v4.completed.filter(x=>typeof x==='number').length}/${v4Challenges.length} challenges · ${v4.badges.join(', ')||'No badges yet'}</p><button onclick="v4Hub()">Keep practising →</button></div>`);
};
</script></body></html>
